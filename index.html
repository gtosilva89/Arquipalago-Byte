<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arquipélago Byte • Revisão Geral</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--out:#1d3347;--azul:#1f8fd8;--fundo:#0f3550;--papel:#fffaf0;--amarelo:#ffca28;--verde:#2e9e4f;--verm:#e5533d;--txt:#1d2b3a;--sombra:0 6px 0 rgba(0,0,0,.18);
 --fonte:'Baloo 2',ui-rounded,'Segoe UI',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:var(--fonte);background:#0f3550;color:var(--txt);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;font-weight:800;font-size:17px;border:3px solid var(--out);border-radius:14px;padding:8px 16px;background:var(--amarelo);color:var(--out);cursor:pointer;box-shadow:0 4px 0 var(--out);transition:transform .08s}
button:hover{filter:brightness(1.06)}button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--out)}
button.sec{background:#fff}button.verde{background:#7ee08a}button.verm{background:#ff8a7a}button.azul{background:#8fd3ff}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,[role=button]:focus-visible{outline:4px solid #ff4081;outline-offset:2px}
input,textarea{font-family:inherit;font-size:18px;border:3px solid var(--out);border-radius:12px;padding:8px 12px;width:100%;background:#fff;color:var(--txt)}
textarea{font-family:var(--mono);font-size:15px;min-height:150px}
h1,h2,h3{margin:.2em 0;line-height:1.1}
.oculto{display:none!important}
/* ---------- tela inicial ---------- */
#inicio{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
#inicio .fundoIni{position:fixed;inset:0;z-index:-1}#inicio .fundoIni svg{width:100%;height:100%;filter:saturate(1.1) blur(2px);transform:scale(1.05)}
.cartao{background:var(--papel);border:4px solid var(--out);border-radius:24px;box-shadow:0 10px 0 rgba(0,0,0,.25);padding:22px;max-width:560px;width:100%}
.logo{font-size:clamp(34px,7vw,56px);font-weight:800;color:#fff;text-align:center;-webkit-text-stroke:2px var(--out);paint-order:stroke fill;text-shadow:0 5px 0 var(--out);letter-spacing:1px;line-height:1}
.logo span{color:var(--amarelo)}
.subt{text-align:center;font-weight:700;color:#35506a;margin:4px 0 14px}
.linha{display:flex;gap:10px;flex-wrap:wrap}.linha>*{flex:1}
.botoes{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.miniHeroi{display:block;margin:-6px auto 0;width:110px;height:110px}
/* ---------- jogo ---------- */
#jogo{min-height:100%;display:flex;flex-direction:column}
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;background:#14476b;border-bottom:4px solid var(--out);color:#fff}
.hud .nomeJ{font-size:20px;font-weight:800}.hud .chipH{background:#0b2f4a;border:2px solid #4c86b3;border-radius:999px;padding:2px 12px;font-weight:800}
.hud .esp{flex:1}.hud button{font-size:15px;padding:5px 10px;border-radius:11px}
.areaMapa{position:relative;flex:1;display:flex;flex-wrap:wrap;gap:12px;padding:12px;align-items:flex-start;justify-content:center}
.mapaBox{flex:1 1 760px;max-width:1200px;border:4px solid var(--out);border-radius:20px;overflow:hidden;box-shadow:var(--sombra);background:#1f8fd8}
.mapaBox svg{display:block;width:100%;height:auto}
.painel{flex:0 1 330px;background:var(--papel);border:4px solid var(--out);border-radius:20px;padding:14px;box-shadow:var(--sombra);min-width:280px}
.painel .tag{display:inline-block;border:2px solid var(--out);border-radius:999px;padding:0 10px;font-weight:800;font-size:14px;color:#fff}
.painel .estrelas{font-size:26px;letter-spacing:2px}.painel p{margin:.4em 0}
.listaMundos{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:330px;overflow:auto}
.listaMundos button{text-align:left;font-size:15px;padding:6px 10px;display:flex;justify-content:space-between;gap:8px}
/* nós do mapa */
.no{cursor:pointer}.no circle.base{stroke:var(--out);stroke-width:4}
.no.aberto circle.base{fill:url(#noBrilho);animation:pulsar 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.no.feito circle.base{fill:#7ee08a}.no.trancado circle.base{fill:#b0bec5}.no.trancado{cursor:not-allowed}
.no.sel circle.anel{stroke:#ff4081;stroke-width:5;fill:none;stroke-dasharray:8 6;animation:girar 4s linear infinite;transform-box:fill-box;transform-origin:center}
.no text{font-weight:800;font-family:var(--fonte);pointer-events:none}
.no.secreta circle.base{fill:#e1bee7}.no.secreta.feito circle.base{fill:#ce93d8}
.rotulo{font-family:var(--fonte);font-weight:800;pointer-events:none}
@keyframes pulsar{50%{transform:scale(1.12)}}@keyframes girar{to{transform:rotate(360deg)}}
.onda{animation:onda 6s ease-in-out infinite}@keyframes onda{50%{transform:translateX(10px);opacity:.3}}
.nuvem{animation:nuvem 40s linear infinite}.n2{animation-duration:55s}.n3{animation-duration:48s;animation-direction:reverse}.n4{animation-duration:60s}
@keyframes nuvem{0%{translate:0 0}50%{translate:60px 0}100%{translate:0 0}}
.bit{animation:boiar 1.6s ease-in-out infinite}@keyframes boiar{50%{transform:translateY(-6px)}}
.bit-luz{animation:piscar 2s infinite}@keyframes piscar{50%{fill:#ff7043}}
.luz{animation:luz 3s ease-in-out infinite;transform-origin:12px -66px}@keyframes luz{50%{opacity:.15}}
.sinal{animation:piscar2 1.5s infinite}@keyframes piscar2{50%{opacity:.1}}
.barco{animation:barco 3s ease-in-out infinite}@keyframes barco{50%{translate:0 4px;rotate:3deg}}
.garrafa{cursor:pointer;animation:barco 2.4s ease-in-out infinite}
.sol{cursor:pointer}.glitch{animation:glitch 1.2s steps(2) infinite}@keyframes glitch{50%{translate:2px -1px;filter:hue-rotate(90deg)}}
.bandeira{animation:band 1s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}@keyframes band{50%{transform:scaleX(.8)}}
.dancando{animation:danca .35s ease-in-out 6 alternate!important}@keyframes danca{from{transform:rotate(-12deg) translateY(-4px)}to{transform:rotate(12deg) translateY(-10px)}}
body.noite .mapaBox svg{filter:brightness(.62) saturate(1.2) hue-rotate(-15deg)}
body.arcoiris .mapaBox svg{animation:arco 3s linear infinite}@keyframes arco{to{filter:hue-rotate(360deg)}}
/* ---------- janelas ---------- */
.veu{position:fixed;inset:0;background:rgba(8,28,44,.72);display:flex;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;z-index:50}
.janela{background:var(--papel);border:4px solid var(--out);border-radius:22px;box-shadow:0 10px 0 rgba(0,0,0,.3);padding:18px;max-width:880px;width:100%;margin:auto;position:relative}
.janela .fechar{position:absolute;top:10px;right:10px;padding:2px 10px}
.acoes{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}
.dica{background:#e8f4ff;border:2px dashed #4c86b3;border-radius:12px;padding:8px 12px;margin:8px 0;font-size:16px}
.alerta{background:#fff3cd;border:2px solid #e0a800;border-radius:12px;padding:8px 12px;margin:8px 0}
.codigo{font-family:var(--mono);font-size:28px;font-weight:700;letter-spacing:2px;text-align:center;background:#0b2a3a;color:#80ffea;border:3px solid var(--out);border-radius:14px;padding:12px;margin:10px 0;word-break:break-all;user-select:all}
pre{font-family:var(--mono);background:#0b2a3a;color:#e0f7fa;border:3px solid var(--out);border-radius:12px;padding:10px 12px;font-size:15px;overflow:auto;margin:8px 0;white-space:pre-wrap}
/* ---------- batalha ---------- */
.batalha{max-width:900px;padding:0;overflow:hidden}
.cenaSvg{display:block;width:100%;height:auto;max-height:240px;border-bottom:4px solid var(--out)}
.barraB{display:flex;align-items:center;gap:12px;padding:8px 14px;background:#14476b;color:#fff;flex-wrap:wrap}
.coracoes{font-size:24px;letter-spacing:2px}.hp{flex:1;min-width:140px;height:18px;background:#0b2f4a;border:3px solid var(--out);border-radius:999px;overflow:hidden}
.hp i{display:block;height:100%;background:linear-gradient(#ff8a80,#e53935);transition:width .4s}
.perguntaBox{padding:14px 16px 18px}
.enunciado{font-size:21px;font-weight:800;margin:4px 0 6px}
.opcoes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.opcoes button{background:#fff;text-align:left;font-weight:700;font-size:16px;min-height:56px;display:flex;gap:8px;align-items:flex-start;line-height:1.2}
.opcoes button .k{flex:none;width:28px;height:28px;border-radius:8px;background:#e3f2fd;border:2px solid var(--out);display:flex;align-items:center;justify-content:center;font-size:14px}
.opcoes button.certa{background:#9be7a5}.opcoes button.errada{background:#ffab9f}
.opcoes button code,.enunciado code{font-family:var(--mono);font-size:.92em;background:#eef3f7;border-radius:5px;padding:0 4px}
.fb{border:3px solid var(--out);border-radius:14px;padding:10px 12px;margin-top:12px;font-weight:700}.fb.ok{background:#d9f7dd}.fb.no{background:#ffe1dc}
.tremer{animation:tremer .35s}@keyframes tremer{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pulo{animation:pulo .45s}@keyframes pulo{50%{transform:translateY(-26px)}}
.faisca{animation:faisca .6s forwards}@keyframes faisca{to{opacity:0;transform:scale(2)}}
/* livros, ranking, tabelas */
.cardC{border:3px solid var(--out);border-radius:14px;padding:10px 12px;margin:8px 0;background:#fff}
.cardC h4{margin:0 0 4px;font-size:18px}
table{border-collapse:collapse;width:100%;font-size:15px}th,td{border:2px solid #c9d6e2;padding:5px 7px;text-align:left;vertical-align:top}th{background:#14476b;color:#fff}
.podio td:first-child{font-weight:800;text-align:center;width:46px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--out);color:#fff;border:3px solid #ffca28;border-radius:14px;padding:10px 18px;font-weight:800;z-index:80;max-width:92vw;text-align:center}
.conq{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}.conq div{border:3px solid var(--out);border-radius:12px;padding:8px;background:#fff;text-align:center}.conq div.nao{opacity:.45;filter:grayscale(1)}
@media (max-width:700px){.opcoes{grid-template-columns:1fr}.enunciado{font-size:18px}.hud .nomeJ{font-size:17px}.painel{flex-basis:100%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body>
<div id="inicio">
  <div class="fundoIni" id="fundoIni" aria-hidden="true"></div>
  <div class="cartao">
    <svg class="miniHeroi" viewBox="-40 -70 80 110" aria-hidden="true" id="miniHeroi"></svg>
    <div class="logo">ARQUIPÉLAGO <span>BYTE</span></div>
    <div class="subt">Revisão geral • Técnico em IA • Python, Banco de Dados, Hardware e Redes</div>
    <label for="nomeAluno"><b>Seu nome completo</b></label>
    <input id="nomeAluno" autocomplete="off" maxlength="60" placeholder="Ex.: Maria Souza">
    <div class="botoes">
      <button id="btNovo" class="verde" type="button">▶ Começar aventura</button>
      <button id="btCont" class="azul" type="button">🔑 Continuar com meu código</button>
      <div class="linha"><button id="btRankIni" class="sec" type="button">🏆 Ranking</button><button id="btProf" class="sec" type="button">🔒 Professor</button></div>
    </div>
    <p class="dica">Sem salvamento automático: no fim de cada fase, clique em <b>Salvar</b> e anote o seu código. Com ele, você continua em qualquer computador.</p>
  </div>
</div>
<div id="jogo" class="oculto">
  <header class="hud" aria-label="Status">
    <span class="nomeJ" id="hNome">—</span>
    <span class="chipH" title="Estrelas">⭐ <span id="hEst">0</span></span>
    <span class="chipH" title="Pontos do ranking">🏅 <span id="hPts">0</span></span>
    <span class="chipH" title="Conquistas">🎖️ <span id="hConq">0</span>/8</span>
    <span class="esp"></span>
    <button class="sec" id="btRank" type="button">🏆 Ranking</button>
    <button class="sec" id="btConq" type="button">🎖️ Conquistas</button>
    <button class="sec" id="btLivros" type="button">📖 Livros</button>
    <button id="btSalvar" type="button">💾 Salvar</button>
    <button class="sec" id="btSom" type="button" aria-pressed="true">🔊</button>
    <button class="sec" id="btSair" type="button">Sair</button>
  </header>
  <div class="areaMapa">
    <div class="mapaBox"><svg id="mapa" viewBox="0 0 1200 720" role="img" aria-label="Mapa do Arquipélago Byte"></svg></div>
    <aside class="painel" id="painel" aria-live="polite"></aside>
  </div>
</div>
<div class="veu oculto" id="veu"><div class="janela" id="janela" role="dialog" aria-modal="true"></div></div>
<div class="toast oculto" id="toast" role="status"></div>
<script>
// ===================== CONTEÚDO DO JOGO (Turma 202600029 - Técnico em IA) =====================
// Revisão geral do que a turma viu no LMS (aulas 01 a 61) e nas aulas do Gustavo (Cantina, 23/10, 29/10, 13/11).
// NÃO inclui o reforço Interclasse. Cada pergunta: t = indicador (py1..py4, bd2..bd6, gp1..gp3),
// q = enunciado, c = código (opcional), o = opções (a PRIMEIRA é a certa; o jogo embaralha), e = explicação.
const Q=(t,q,c,o,e)=>({t,q,c,o,e});

const IND={
 py1:['UC05 Python','1','Elabora código, conforme as funcionalidades e as características do aplicativo computacional a ser desenvolvido na linguagem Python.'],
 py2:['UC05 Python','2','Utiliza comandos de integração dos códigos construídos em Python, conforme estrutura projetada.'],
 py3:['UC05 Python','3','Realiza a depuração, verificando e corrigindo erros na programação, de acordo com recomendação técnica.'],
 py4:['UC05 Python','4','Utiliza bibliotecas de manipulação de dados para aplicações de Inteligência Artificial.'],
 bd2:['UC08 Banco de Dados','2','Seleciona o Sistema de Gerenciamento de Banco de Dados (SGBD), de acordo com as necessidades da aplicação.'],
 bd3:['UC08 Banco de Dados','3','Cria a estrutura física de banco de dados, de acordo com os requisitos da aplicação e da modelagem de dados.'],
 bd4:['UC08 Banco de Dados','4','Gerencia a permissão de acesso ao banco de dados, de acordo com o perfil do usuário e as políticas de acesso.'],
 bd5:['UC08 Banco de Dados','5','Cria e manipula consultas SQL de forma adequada para resolução de problemas.'],
 bd6:['UC08 Banco de Dados','6','Cria e manipula armazenamento e backup de banco de dados.'],
 gp1:['UC06 GPU e CPU','1','Reconhece modelos aplicados em arquitetura de computadores e GPU.'],
 gp2:['UC06 GPU e CPU','2','Reconhece e aplica conceitos de Pipeline para GPU.'],
 gp3:['UC06 GPU e CPU','3','Interpreta processos e threads em arquitetura de computadores e GPU.'],
 gp4:['UC06 GPU e CPU','4','Reconhece protocolos e serviços básicos de redes de computadores.'],
 gp5:['UC06 GPU e CPU','5','Compreende e aplica endereçamento de redes IPv4 e IPv6.'],
 extra:['Extra (fase secreta)','—','Curiosidades: não entra na avaliação.']
};

const MUNDOS=[
 {id:0,nome:'Ilha do Python',sub:'O começo de tudo',cor:'#3fb950',inimigo:0,codigo:null},
 {id:1,nome:'Floresta das Funções',sub:'Receitas, erros e dados',cor:'#2f9e8f',inimigo:1,codigo:'FUNCAO'},
 {id:2,nome:'Montanha dos Dados',sub:'Banco de dados de verdade',cor:'#8b6cd8',inimigo:2,codigo:'TABELA'},
 {id:3,nome:'Cidade do Hardware',sub:'CPU, GPU e threads',cor:'#2b8fd6',inimigo:3,codigo:'CHIP'},
 {id:4,nome:'Arquipélago das Redes',sub:'Como a internet funciona',cor:'#f0a020',inimigo:4,codigo:'REDE'},
 {id:5,nome:'Castelo da IA',sub:'Desafio final com tudo',cor:'#e5533d',inimigo:5,codigo:'CASTELO'}
];


// Missões escritas: 1 por mundo. O jogo confere palavras-chave; o professor lê o texto no relatório.
const MISSOES=[
 {m:0,id:'m1',ind:'py1',t:'Missão da Ilha: o caixa da cantina',pede:'Escreva em Python um programa que pergunta o PREÇO de um salgado e a QUANTIDADE, calcula o total e mostra o total na tela. Se o total passar de 20, mostre também "Ganhou um suco!".',
  dicas:['use input() e converta com float() ou int()','faça a conta e guarde numa variável','use print() para mostrar','use if para o suco'],
  chaves:[[/input\s*\(/,'input()'],[/(float|int)\s*\(/,'float() ou int()'],[/print\s*\(/,'print()'],[/\bif\b/,'if'],[/20/,'o número 20']],min:4},
 {m:1,id:'m2',ind:'py2',t:'Missão da Floresta: a função do troco',pede:'Escreva uma função calcular_troco(valor_pago, total) que DEVOLVE o troco com return. Depois, mostre na tela o troco de uma compra de 13.50 paga com 20.',
  dicas:['comece com def','use return (não só print) dentro da função','chame a função com 20 e 13.50 dentro de um print'],
  chaves:[[/def\s+calcular_troco\s*\(/,'def calcular_troco('],[/return\b/,'return'],[/print\s*\(\s*calcular_troco\s*\(/,'print(calcular_troco(...))'],[/13[.,]5/,'13.50']],min:4},
 {m:2,id:'m3',ind:'bd5',t:'Missão da Montanha: o painel da cantina',pede:'Escreva a consulta SQL que mostra, da tabela vendas, o produto_id e o TOTAL de unidades vendidas (SUM(quantidade)) de cada produto, do MAIOR para o menor.',
  dicas:['SELECT produto_id, SUM(quantidade) ...','FROM vendas','GROUP BY produto_id','ORDER BY ... DESC'],
  chaves:[[/select/i,'SELECT'],[/sum\s*\(\s*quantidade\s*\)/i,'SUM(quantidade)'],[/from\s+vendas/i,'FROM vendas'],[/group\s+by/i,'GROUP BY'],[/order\s+by/i,'ORDER BY'],[/desc/i,'DESC']],min:6},
 {m:3,id:'m4',ind:'gp1',t:'Missão da Cidade: explique para um colega',pede:'Explique com as suas palavras, em pelo menos 3 linhas, por que a GPU treina IA mais rápido que a CPU. Use as palavras NÚCLEOS e PARALELO.',
  dicas:['compare: poucos núcleos fortes × muitos núcleos simples','diga o que é fazer em paralelo','dê um exemplo (pixels, contas da IA)'],
  chaves:[[/n[uú]cleo/i,'núcleos'],[/paralel/i,'paralelo'],[/cpu/i,'CPU'],[/gpu/i,'GPU']],min:4,linhas:3}
];
MISSOES.push({m:4,id:'m5',ind:'gp4',t:'Missão das Redes: o caminho do site',pede:'Você digita www.nic.br e aperta Enter. Explique, em pelo menos 5 linhas, o caminho até a página aparecer. Fale do DNS, do endereço IP, dos pacotes e do provedor.',
 dicas:['o DNS traduz o nome em IP (resolver, recursivo, autoritativo)','a página vem dividida em pacotes','o provedor e os Sistemas Autônomos (BGP) levam os pacotes'],
 chaves:[[/dns/i,'DNS'],[/\bip\b/i,'IP'],[/pacote/i,'pacotes'],[/provedor/i,'provedor']],min:4,linhas:5});
// ===================== ILHA DO PYTHON (UC05) =====================
const F_PYTHON=[
{id:'P1',m:0,nome:'Praia do print',tema:'print() e f-string',aulas:'A04, A05, A10',qs:[
 Q('py1','Qual comando mostra uma mensagem na tela?',null,['print("Olá")','input("Olá")','show("Olá")','echo "Olá"'],'print() é a saída: mostra na tela.'),
 Q('py1','O que este código mostra?','print("Bom", "dia")',['Bom dia','Bomdia','"Bom", "dia"','Dá erro'],'Com vírgula, o print separa os itens com um espaço.'),
 Q('py1','O que este código mostra?','nome = "Bia"\nnota = 8.5\nprint(f"{nome} tirou {nota}")',['Bia tirou 8.5','{nome} tirou {nota}','nome tirou nota','Dá erro'],'Na f-string, o que está entre chaves é trocado pelo valor.'),
 Q('py1','O que está faltando para isto virar f-string?','print("Olá, {nome}!")',['A letra f antes das aspas','Mais chaves','Um ponto e vírgula','Nada, já funciona'],'Sem o f, o Python mostra {nome} do jeito que está.'),
 Q('py1','O que este código mostra?','print("Py" + "thon")',['Python','Py thon','Py + thon','Dá erro'],'+ entre textos junta (concatena) sem espaço.'),
 Q('py1','O que este código mostra?','print("ha" * 3)',['hahaha','ha3','ha ha ha','Dá erro'],'Texto vezes número repete o texto.'),
 Q('py1','O que este código mostra?','x = 5\nprint("x")',['x','5','"x"','Dá erro'],'Entre aspas é texto. Para mostrar o valor, use print(x).'),
 Q('py1','O que este código mostra?','preco = 3.14159\nprint(f"{preco:.2f}")',['3.14','3.14159','3','3.1'],':.2f deixa 2 casas depois da vírgula.'),
 Q('py3','Por que dá erro?','print("Olá)',['Faltou fechar as aspas','Faltou o f','print não aceita texto','Faltou ponto e vírgula'],'Toda aspa aberta precisa ser fechada.'),

const sfx={ok:()=>{tom(660,.1);tom(990,.14,'square',.06,.09)},erro:()=>{tom(220,.25,'sawtooth',.05)},clique:()=>tom(520,.05,'triangle',.05),

function mundoLiberado(m){if(m<=0)return true;if(S.lib[m])return true;
 if(m===5)return [0,1,2,3,4].every(k=>DO_MUNDO(k).every(f=>feita(f.id)));
 return DO_MUNDO(m-1).every(f=>feita(f.id))}
function faseAberta(id){const f=FASE[id];if(f.secreta)return segredoVisivel(id);if(!mundoLiberado(f.m))return false;const L=DO_MUNDO(f.m);const i=L.indexOf(f);return i===0||feita(L[i-1].id)}
function segredoVisivel(id){return id==='s1'?!!S.cq.garrafa:id==='s2'?!!S.cq.turing:id==='s3'?feita('C1'):false}

// ---------- código de salvamento ----------
const ALFA='23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
const pushN=(b,v,n)=>{for(let i=n-1;i>=0;i--)b.push((v>>i)&1)};
const readN=(b,p,n)=>{let v=0;for(let i=0;i<n;i++)v=(v<<1)|b[p.i++];return v};
function hashBits(bits,nome){let h=2166136261>>>0;const s=bits.join('')+'|byte|'+normNome(nome);for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h&2047}
function fluxo(sal){let x=(sal*7919+54321)>>>0;return()=>{x=(Math.imul(x,1103515245)+12345)>>>0;return(x>>>16)&1}}
const NBITS=3+FASES.length*2+MISSOES.length+5+CONQ.length;
function gerarCodigo(st){const b=[];pushN(b,2,3);
 for(const f of FASES){const p=st.P[f.id]||{};pushN(b,p.e||0,2)}
 for(const m of MISSOES)pushN(b,(st.M[m.id]||{}).ok?1:0,1);
 for(let k=1;k<=5;k++)pushN(b,st.lib[k]?1:0,1);
 for(const c of CONQ)pushN(b,st.cq[c[0]]?1:0,1);
 pushN(b,hashBits(b,st.nome),11);
 const sal=Math.floor(Math.random()*32),k=fluxo(sal),tudo=[];pushN(tudo,sal,5);for(const x of b)tudo.push(x^k());
 while(tudo.length%5)tudo.push(0);let c='';for(let i=0;i<tudo.length;i+=5){let v=0;for(let j=0;j<5;j++)v=(v<<1)|tudo[i+j];c+=ALFA[v]}
 return c.match(/.{1,4}/g).join('-')}
function lerCodigo(cod,nome){const t=String(cod||'').toUpperCase().replace(/[^0-9A-Z]/g,'').replace(/O/g,'0').replace(/I/g,'1');
 const tudo=[];for(const ch of t){const v=ALFA.indexOf(ch);if(v<0)return{erro:'O código tem um caractere que não existe (confira 0/O e 1/I).'};pushN(tudo,v,5)}
 if(tudo.length<5+NBITS+11)return{erro:'Código curto demais. Confira se copiou tudo.'};
 const p0={i:0},sal=readN(tudo,p0,5),k=fluxo(sal),b=[];for(let i=0;i<NBITS+11;i++)b.push(tudo[5+i]^k());
 const p={i:0};if(readN(b,p,3)!==2)return{erro:'Código de outra versão do jogo.'};
 const st=novoEstado(nome);
 // O código guarda só as estrelas. A 1ª tentativa é estimada pelas estrelas (o dado exato vai para a planilha).
 for(const f of FASES){const e=readN(b,p,2);if(e){const n=f.n;const q=e;const ac=q===3?n:q===2?Math.round(n*.75):Math.round(n*.5);st.P[f.id]={e,p1:q,ac1:ac,tot1:n,erros:e===3?0:e===2?1:2,tent:1,cons:0,doCodigo:true}}}
 for(const m of MISSOES)if(readN(b,p,1))st.M[m.id]={ok:true,txt:'(texto salvo em outro computador ou na planilha)'};
 for(let j=1;j<=5;j++)if(readN(b,p,1))st.lib[j]=true;
 for(const c of CONQ)if(readN(b,p,1))st.cq[c[0]]=true;
 const ck=readN(b,p,11);if(ck!==hashBits(b.slice(0,p.i-11),nome))return{erro:'O código não confere com este nome. Use o nome igualzinho ao do dia em que salvou e confira cada letra.'};
 return{S:st}}

  else{B.vidas--;B.er++;r.erros=(r.erros||0)+1;sfx.erro();anima('bugB','pulo');anima('heroiB','tremer');atualizarBarra(B);

  if(r.ok){sfx.vitoria();$('mFb').innerHTML=`<div class="fb ok">✔ Missão cumprida! (+150 pontos) Agora salve o jogo.</div>`;hud();painel()}

function suspeitaIA(txt,m,esperado){const mot=[];let s=0;const n=txt.replace(/\s/g,'').length;
 if(m){if(n>12&&n>m.teclas*1.25+8){s+=3;mot.push('texto apareceu sem ser digitado')}
  if(m.maxSalto>25){s+=3;mot.push('bloco grande de texto inserido de uma vez')}
  const seg=Math.max(1,m.ativo/1000);if(n>40&&n/seg>9){s+=2;mot.push('velocidade de digitação impossível')}
  if(m.colagens>0){s+=1;mot.push(m.colagens+' tentativa(s) de colar')}}
 let mk=0;for(const[re,t]of MARCAS_IA)if(re.test(txt)&&mk<3){mk++;s+=1;mot.push(t)}
 if(esperado&&n>esperado*3.5){s+=1;mot.push('muito mais longo do que o pedido')}

 <h2>Registros digitados à mão (golpe final de cada fase)</h2>${a.regs.map(({id,r})=>`<h3 style="font-size:14px;margin:12px 0 2px">${esc(FASE[id].nome)} • ${esc(IND[REG[id].ind][0])} ind. ${IND[REG[id].ind][1]} • ${r.ok?'✔ aceito':r.tent?'não concluído':'não fez'}${r.rej?` <span class="warn">⚠ ${r.rej} recusa(s) por colagem/IA</span>`:''}</h3>
  <div style="font-size:12px;color:#556">Pedido: ${esc(REG[id].pede(X).replace(/\n\n[\s\S]*/,''))}${r.tent?` • tentativas ${r.tent} • teclas ${r.teclas||0} • ${r.seg||0}s digitando • colagens bloqueadas ${r.colagens||0}`:''}${r.motivos&&r.motivos.length?` • sinais: ${esc(r.motivos.join('; '))}`:''}</div>${r.tent?`<pre>${esc(r.txt||r.ult||'')}</pre>`:''}`).join('')}
 <h2>Missões escritas</h2>${MISSOES.map(mi=>{const m=(s.M||{})[mi.id]||{};return `<h3 style="font-size:14px;margin:12px 0 2px">${esc(mi.t)} • ${m.ok?'✔ conferida':'pendente'}${m.rej?` <span class="warn">⚠ ${m.rej} recusa(s)</span>`:''}</h3><div style="font-size:12px;color:#556">${m.tent?`tentativas ${m.tent} • teclas ${m.teclas||0} • ${m.seg||0}s • colagens ${m.colagens||0}`:''}${m.motivos&&m.motivos.length?' • sinais: '+esc(m.motivos.join('; ')):''}</div><pre>${esc(m.txt||'(em branco)')}</pre>`}).join('')}
