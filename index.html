<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arquipélago Byte</title>
<style>
:root{--mar1:#0b3d5c;--mar2:#11698e;--areia:#f6e3b4;--tinta:#10202b;--card:#ffffff;--suave:#5b6b75;--ok:#1f9d55;--pa:#e0a100;--na:#d64545;--azul:#1d6fb8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--tinta);background:radial-gradient(1200px 700px at 30% 20%,#1b86b3 0%,var(--mar2) 40%,var(--mar1) 100%) fixed;font-size:17px}
.nosel{-webkit-user-select:none;user-select:none}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;color:#fff;background:rgba(5,30,45,.55);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.3px}header .sp{flex:1}
header button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.35)}
@media (max-width:600px){header{position:static;background:#0b3a52;gap:8px}header h1{font-size:17px;width:100%}header button{padding:6px 10px}}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 8px 30px rgba(0,0,0,.25);margin:12px 0}
button{font:inherit;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;background:var(--azul);color:#fff;font-weight:600}
button.sec{background:#e8eef2;color:var(--tinta)}button:disabled{opacity:.45;cursor:not-allowed}
input,textarea,select{font:inherit;padding:10px;border:2px solid #c9d6de;border-radius:10px;width:100%}
textarea{min-height:170px;font-family:Consolas,"Courier New",monospace;font-size:16px;line-height:1.4}
label{font-weight:600;display:block;margin:10px 0 4px}
.mapa{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.ilha{position:relative;border-radius:22px;padding:14px 14px 16px;cursor:pointer;color:var(--tinta);background:var(--areia);box-shadow:0 10px 0 rgba(0,0,0,.18),0 18px 30px rgba(0,0,0,.25);transition:transform .12s}
.ilha:hover{transform:translateY(-3px)}
.ilha svg{width:100%;height:110px;display:block}
.ilha h3{margin:6px 0 2px;font-size:18px}.ilha .uc{font-size:13px;color:var(--suave);min-height:34px}
.barra{height:10px;background:#e2d3a8;border-radius:8px;overflow:hidden;margin-top:8px}.barra i{display:block;height:100%;background:var(--ok)}
.selo{position:absolute;top:10px;right:10px;font-weight:800;border-radius:999px;padding:4px 12px;color:#fff;font-size:14px}
.A{background:var(--ok)}.PA{background:var(--pa)}.NA{background:var(--na)}.nd{background:#7d8b93}
.trilha{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.nivel{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;background:#e8eef2;color:#7d8b93;border:3px solid transparent}
.nivel.feito{background:#d8f3e3;color:var(--ok)}.nivel.meio{background:#fff1c7;color:#a87700}.nivel.errado{background:#fde0e0;color:var(--na)}.nivel.atual{border-color:var(--azul);color:var(--azul);background:#fff}
.chefe{width:auto;padding:0 18px;border-radius:30px}
.q{font-size:20px;font-weight:600;margin:6px 0 12px;white-space:pre-wrap}
pre.cod{background:#0f2230;color:#e8f6ff;border-radius:12px;padding:14px;font-size:16px;overflow:auto;font-family:Consolas,"Courier New",monospace}
.ops{display:grid;gap:10px}.op{text-align:left;background:#f1f6f9;color:var(--tinta);border:2px solid #d5e1e8;font-weight:500}
.op:hover{border-color:var(--azul)}.op.marcada{background:#e3eefc;border-color:var(--azul)}.op.certa{background:#d8f3e3;border-color:var(--ok)}.op.errada{background:#fde0e0;border-color:var(--na)}
.fb{border-radius:12px;padding:12px;margin-top:12px;font-weight:500}.fb.ok{background:#d8f3e3}.fb.no{background:#fde0e0}.fb.meio{background:#fff1c7}
.tag{display:inline-block;font-size:12px;background:#e8eef2;border-radius:8px;padding:2px 8px;margin-right:6px;color:var(--suave)}
.linha{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.peq{font-size:14px;color:var(--suave)}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid #d5e1e8;padding:6px;text-align:left;vertical-align:top}th{background:#eef4f8}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#10202b;color:#fff;padding:12px 18px;border-radius:12px;z-index:50;box-shadow:0 8px 20px rgba(0,0,0,.35)}
@media (max-width:600px){body{font-size:16px}.q{font-size:18px}main{padding:10px}}
</style>
</head><body>
<header><h1>🏝️ Arquipélago Byte</h1><span class="sp"></span><span id="quem"></span><button id="bMapa" class="sec" style="display:none">Mapa</button><button id="bProf">🔒 Área do professor</button></header>
<main id="app"></main>
<script>
// ===================== ARQUIPÉLAGO BYTE: RECUPERAÇÃO (turma 202600029, Técnico em IA, 1º ano) =====================
// 9 ilhas = 9 UCs do 1º ano (Plano de Curso 2025). Cada ilha: 10 níveis (1 pergunta por nível) + chefão (5 sorteadas
// do banco do chefão, com 1 dissertativa) + banco de recuperação (5 sorteadas, com pelo menos 1 dissertativa).
// M(ind, pergunta, codigo|null, [opções: a PRIMEIRA é a certa], explicação)
// T(ind, pergunta (texto ou função de X), chaves [[regex sem acento, rótulo]...], mínimo de chaves, mínimo de letras, resposta modelo)
// As chaves são testadas no texto do aluno em minúsculas e SEM acentos.
const M=(i,q,c,o,e)=>({tipo:'mc',i,q,c,o,e});
const T=(i,q,ch,min,letras,mod)=>({tipo:'txt',i,q,ch,min,letras,mod});
const UCS=[];
const UC=u=>UCS.push(u);
UC({id:'py',nome:'Ilha do Python',uc:'Desenvolver linguagem de programação Python',ch:'67 h',cor:'#3fb950',
inds:{1:'Elabora código, conforme as funcionalidades e as características do aplicativo computacional a ser desenvolvido na linguagem Python.',
2:'Utiliza comandos de integração dos códigos construídos em Python, conforme estrutura projetada.',
3:'Realiza a depuração, verificando e corrigindo erros na programação, de acordo com recomendação técnica.',
4:'Utiliza bibliotecas de manipulação de dados para aplicações de Inteligência Artificial.'},
niveis:[
 M(1,'O que este código mostra?','nome = "Bia"\nnota = 8.5\nprint(f"{nome} tirou {nota}")',['Bia tirou 8.5','{nome} tirou {nota}','nome tirou nota','Dá erro'],'Na f-string, o que está entre chaves vira o valor da variável.'),
 M(1,'O aluno digitou 42. Qual é o tipo de x?','x = input("Valor: ")',['str (texto), porque input() sempre devolve texto','int, porque é número','float','Depende do teclado'],'input() sempre devolve str. Para fazer conta, converta com int() ou float().'),
 M(1,'O que aparece se a nota for 7?','nota = 7\nif nota >= 9:\n    print("Ótimo")\nelif nota >= 6:\n    print("Bom")\nelse:\n    print("Estudar mais")',['Bom','Ótimo','Estudar mais','Bom e Estudar mais'],'O Python testa de cima para baixo e para no primeiro bloco verdadeiro.'),
 M(1,'O que este código mostra?','total = 0\nfor n in range(1, 5):\n    total = total + n\nprint(total)',['10','15','4','5'],'range(1, 5) vai de 1 a 4: 1+2+3+4 = 10.'),
 T(1,X=>`Escreva um programa em Python que pergunta o PREÇO de um lanche e a QUANTIDADE, calcula o total e mostra o total. Se o total passar de ${10+X} reais, mostre também "Ganhou um suco!".`,
  [['input\\s*\\(','input()'],['(float|int)\\s*\\(','float() ou int()'],['print\\s*\\(','print()'],['\\bif\\b','if'],[null,'o número certo',X=>String(10+X)]],4,40,''),
 M(2,'O que este código mostra?','def dobro(n):\n    return n * 2\n\nprint(dobro(3) + 1)',['7','6','8','Dá erro'],'dobro(3) devolve 6 com return; 6 + 1 = 7.'),
 M(3,'Este código deu TypeError. Qual é a causa?','qtd = input("Quantos? ")\ntotal = qtd * 6.5',['input devolve texto e falta converter com int()','6.5 deveria ser 6,5','falta o print','total não existe'],'Texto não multiplica por número decimal. Correção: qtd = int(input(...)).'),
 M(4,'Qual é o valor da coxinha em vendas.groupby("produto")["qtd"].sum()?','produto | qtd\ncoxinha |  4\nsuco    |  2\ncoxinha |  3',['7','4','3','9'],'groupby junta as linhas do mesmo produto e soma: 4 + 3 = 7.'),
 T(3,'O código abaixo tem 2 erros. Explique cada um: o nome do erro que aparece, a linha, a causa e como corrigir.\n\nprecos = [5, 3, 2]\nfor p in precos\n    total = totl + p',
  [['syntax|dois[- ]?pontos|:','falta dos dois-pontos no for (SyntaxError)'],['name ?error|totl|nome errad','NameError / nome errado'],['linha','a linha do erro'],['corrig|troc|coloc|arrum','a correção']],3,60,''),
 M(2,'O que este programa mostra?','def media(lista):\n    soma = 0\n    for n in lista:\n        soma = soma + n\n    return soma / len(lista)\n\nnotas = [6, 8, 10]\nprint(media(notas) > 7)',['True','False','8.0','Dá erro'],'A média é 8.0, e 8.0 > 7 é True.')],
chefao:[
 M(1,'Qual laço repete enquanto a senha estiver errada?',null,['while senha != "1234":','for senha in "1234":','if senha != "1234":','repeat senha:'],'while repete enquanto a condição for verdadeira.'),
 M(2,'Qual é a diferença entre print e return dentro de uma função?',null,['return devolve o valor para quem chamou; print só mostra na tela','São iguais','print devolve e return mostra','return apaga a função'],'Com return o resultado pode ser usado em outra conta.'),
 M(3,'Qual erro aparece em print(precos["Coxinha"]) se a chave é "coxinha"?',null,['KeyError','IndexError','NameError','ValueError'],'Chave de dicionário diferencia maiúscula de minúscula.'),
 M(4,'O que faz vendas[vendas["qtd"] > 3]?',null,['Mostra só as linhas com qtd maior que 3','Apaga as linhas com qtd maior que 3','Soma a coluna qtd','Dá erro sempre'],'Filtro do pandas: a condição entre colchetes escolhe as linhas.'),
 M(3,'Qual é a melhor ordem para depurar?',null,['ler a mensagem, ir à linha, achar a causa, corrigir uma coisa, testar de novo','mudar várias linhas ao mesmo tempo','apagar tudo e começar de novo','pedir para a IA reescrever'],'Uma mudança por vez, sempre testando.'),
 T(2,X=>`Escreva uma função chamada troco(pago, total) que DEVOLVE o troco com return. Depois mostre na tela o troco de uma compra de ${10+X} reais paga com 50.`,
  [['def\\s+troco\\s*\\(','def troco('],['return','return'],['pago\\s*-\\s*total|50\\s*-','a conta pago - total'],['print\\s*\\(\\s*troco\\s*\\(','print(troco(...))'],[null,'o valor da compra',X=>String(10+X)]],4,40,''),
 T(4,'Explique com as suas palavras o que faz o comando vendas.groupby("produto")["qtd"].sum() e dê um exemplo de como ele ajuda o dono de uma cantina.',
  [['junt|agrup','junta/agrupa as linhas'],['produto','do mesmo produto'],['som','soma'],['qtd|quantidade','a quantidade'],['cantina|compr|estoque|vend|repor','um uso na cantina']],4,60,'')],
rec:[
 M(1,'O que este código mostra?','print("ha" * 3)',['hahaha','ha3','ha ha ha','Dá erro'],'Texto vezes número repete o texto.'),
 M(1,'Qual linha lê um preço com centavos pronto para conta?',null,['preco = float(input("Preço: "))','preco = input(float("Preço: "))','preco = int(input("Preço: "))','preco = print(input())'],'Primeiro lê com input(), depois converte para float().'),
 M(1,'O que mostra este código?','frutas = ["maçã", "uva", "pera"]\nprint(frutas[1])',['uva','maçã','pera','Dá erro'],'A lista começa no índice 0.'),
 M(1,'Quantas vezes "Oi" aparece?','for i in range(3):\n    print("Oi")',['3','2','4','1'],'range(3) gera 0, 1 e 2: três voltas.'),
 M(2,'O que este código mostra?','def soma(a, b):\n    return a + b\n\nx = soma(2, 3)\nprint(x * 2)',['10','5','23','Dá erro'],'soma devolve 5; 5 × 2 = 10.'),
 M(3,'Por que dá IndentationError?','if idade >= 18:\nprint("Maior")',['O print está sem recuo dentro do if','Falta aspas','Falta o else','idade não é número'],'Tudo o que fica dentro do if precisa de recuo (4 espaços).'),
 M(3,'O que significa ValueError em int("dois")?',null,['O texto não pode virar número inteiro','A variável não existe','Divisão por zero','A lista acabou'],'int() só converte texto que tem número.'),
 M(4,'Qual comando mostra as 5 primeiras linhas de uma tabela do pandas?',null,['tabela.head()','tabela.top()','tabela.first5','print(5)'],'head() mostra o começo da tabela.'),
 T(1,X=>`Escreva um programa que pede a idade e mostra "Pode votar" se a idade for maior ou igual a 16, e "Não pode votar" se for menor. Teste com a idade ${12+X} e diga o que aparece.`,
  [['input\\s*\\(','input()'],['int\\s*\\(','int()'],['if','if'],['else','else'],['>=\\s*16|16','a comparação com 16'],[null,'a idade do teste',X=>'\\b'+(12+X)+'\\b']],4,40,''),
 T(3,'Um colega escreveu um programa de soma que mostra sempre o último número, e não a soma. Não aparece nenhuma mensagem de erro. Que tipo de erro é esse e como você descobriria e corrigiria?',
  [['logica','erro de lógica'],['test|confer|resultado esperado','testar/conferir o resultado'],['acumul|total\\s*=\\s*total|soma\\s*=\\s*soma','acumular (total = total + ...)'],['mensagem|nao aparece|sem erro','não há mensagem']],3,60,''),
 T(4,X=>`Explique para que servem as bibliotecas pandas, NumPy e Matplotlib. Dê um exemplo de uso de cada uma com dados de uma turma de ${20+X} alunos.`,
  [['pandas','pandas'],['tabela|dataframe|csv|planilha','pandas lida com tabelas'],['numpy','NumPy'],['conta|calcul|array|vetor|numero','NumPy faz contas'],['matplotlib','Matplotlib'],['grafic','Matplotlib faz gráficos']],5,80,''),
 T(2,'Explique com as suas palavras por que é bom dividir um programa grande em funções. Use as palavras PARÂMETRO e RETURN.',
  [['parametro','parâmetro'],['return','return'],['reutiliz|repet|de novo|varias vezes','reaproveitar sem repetir'],['organiz|dividir|partes|entender|ler','organizar o código']],3,60,'')]
});
UC({id:'bd',nome:'Montanha dos Dados',uc:'Desenvolver banco de dados',ch:'67 h',cor:'#8b6cd8',
inds:{1:'Propõe alteração no acesso aos dados, de acordo com os relacionamentos físicos e estrutura.',
2:'Seleciona o Sistema de Gerenciamento de Banco de Dados (SGBD), de acordo com as necessidades da aplicação.',
3:'Cria a estrutura física de banco de dados, de acordo com os requisitos da aplicação e da modelagem de dados.',
4:'Gerencia a permissão de acesso ao banco de dados, de acordo com o perfil do usuário e as políticas de acesso.',
5:'Cria e manipula consultas SQL de forma adequada para resolução de problemas.',
6:'Cria e manipula armazenamento e backup de banco de dados.'},
niveis:[
 M(2,'O que é um SGBD?',null,['O programa que guarda, organiza e controla o acesso ao banco, como o PostgreSQL','Uma planilha do Excel','Um tipo de cabo de rede','Uma linguagem de programação'],'SGBD = Sistema de Gerenciamento de Banco de Dados. Na turma: PostgreSQL com DBeaver.'),
 M(3,'Para que serve a PRIMARY KEY?',null,['Identificar cada linha de forma única, sem repetir','Deixar a tabela mais bonita','Apagar linhas repetidas sozinha','Dar senha à tabela'],'A chave primária não repete e não fica vazia.'),
 M(5,'Qual comando mostra só os produtos com preço acima de 5?',null,['SELECT * FROM produtos WHERE preco > 5;','SELECT * FROM produtos IF preco > 5;','SHOW produtos > 5;','SELECT preco > 5;'],'WHERE filtra as linhas.'),
 M(3,'Qual regra impede que o preço seja negativo?',null,['CHECK (preco >= 0)','NOT NULL','UNIQUE','DEFAULT 0'],'CHECK testa uma condição antes de aceitar o dado.'),
 T(3,X=>`Escreva o CREATE TABLE de uma tabela alunos_${X} com: id (chave primária), nome (texto obrigatório) e idade (inteiro que não pode ser negativo).`,
  [['create\\s+table','CREATE TABLE'],['primary\\s+key','PRIMARY KEY'],['not\\s+null','NOT NULL'],['check','CHECK'],['int','tipo inteiro'],[null,'o nome da tabela com o seu X',X=>'alunos_'+X]],5,40,''),
 M(5,'Qual consulta soma as vendas de CADA produto?',null,['SELECT produto_id, SUM(qtd) FROM vendas GROUP BY produto_id;','SELECT SUM(qtd) FROM vendas;','SELECT produto_id FROM vendas ORDER BY qtd;','SELECT COUNT(*) FROM produtos;'],'GROUP BY faz um total por grupo.'),
 M(4,'O que faz GRANT SELECT ON produtos TO caixa_07; ?',null,['Deixa o caixa_07 consultar produtos','Deixa o caixa_07 apagar produtos','Cria a tabela produtos','Tira todas as permissões'],'GRANT dá permissão; REVOKE tira.'),
 M(6,'O que faz CREATE TABLE produtos_bkp AS SELECT * FROM produtos; ?',null,['Cria uma cópia de segurança da tabela com os dados atuais','Apaga produtos','Renomeia produtos','Dá permissão em produtos'],'É uma forma rápida de backup de uma tabela.'),
 T(5,X=>`A cantina quer saber o faturamento de cada produto (nome e valor), do maior para o menor, só dos que faturaram mais de ${X} reais. Tabelas: produtos(id_produto, nome, preco) e vendas(id_venda, id_produto, quantidade). Escreva a consulta e explique cada parte.`,
  [['join','JOIN'],['on\\s+\\w+\\.id_produto\\s*=\\s*\\w+\\.id_produto','ligação pela chave id_produto'],['sum\\s*\\(','SUM'],['group\\s+by','GROUP BY'],['having','HAVING'],['order\\s+by[\\s\\S]*desc','ORDER BY ... DESC'],[null,'o seu X no HAVING',X=>'>\\s*'+X]],5,60,''),
 M(1,'A diretora quer que o caixa veja o total de vendas, mas não os dados pessoais dos alunos. Qual alteração no acesso é melhor?',null,['Criar uma VIEW só com os totais e dar GRANT SELECT nela ao caixa','Dar GRANT ALL em todas as tabelas','Entregar a senha do postgres ao caixa','Apagar a tabela de alunos'],'A VIEW mostra só o necessário: menor privilégio.')],
chefao:[
 M(5,'O que faz UPDATE produtos SET preco = 1; (sem WHERE)?',null,['Muda o preço de TODOS os produtos','Muda só o primeiro','Dá erro','Não muda nada'],'Sem WHERE, vale para todas as linhas.'),
 M(5,'Para que serve o JOIN?',null,['Juntar linhas de tabelas relacionadas pela chave','Apagar tabelas','Copiar o banco','Criar usuários'],'A chave estrangeira aponta para a chave primária da outra tabela.'),
 M(4,'O que é o princípio do menor privilégio?',null,['Cada usuário recebe só as permissões de que precisa','Todos devem ser administradores','Ninguém pode consultar nada','Quanto mais permissão, melhor'],'Reduz o estrago de um erro ou ataque.'),
 M(6,'Onde é mais seguro guardar o backup?',null,['Fora do servidor: outro disco ou nuvem','Na mesma pasta do banco','Em lugar nenhum','Numa tabela com o mesmo nome'],'Se o servidor quebrar, a cópia continua segura.'),
 M(3,'O que faz REFERENCES produtos(id_produto) na tabela vendas?',null,['Cria uma chave estrangeira: só aceita produtos que existem','Copia a tabela produtos','Apaga produtos sem venda','Ordena as vendas'],'A chave estrangeira garante a ligação entre as tabelas.'),
 T(4,X=>`Monte a política de acesso de uma loja com 2 perfis, trocando NN pelo número ${String(X).padStart(2,'0')}: caixa_NN (consulta produtos e registra vendas) e auditor_NN (só consulta). Escreva os comandos e explique por que cada um tem só essas permissões.`,
  [['create\\s+role','CREATE ROLE'],['grant\\s+select','GRANT SELECT'],['insert','INSERT para o caixa'],['auditor','o perfil auditor'],['menor privilegio|so o que precisa|apenas o necessario|so precisa','menor privilégio'],[null,'o seu NN',X=>String(X).padStart(2,'0')]],5,60,''),
 T(6,'Alguém apagou sem querer todas as linhas da tabela clientes. Explique, passo a passo, como um backup feito antes evitaria o prejuízo: como criar a cópia, como conferir e como restaurar.',
  [['bkp|backup|copia','a cópia'],['create\\s+table|pg_dump|export|csv','como criar a cópia'],['count','conferir com COUNT'],['insert\\s+into|restaur','restaurar']],3,60,'')],
rec:[
 M(5,'Qual comando ordena do mais caro para o mais barato?',null,['ORDER BY preco DESC','ORDER BY preco ASC','GROUP BY preco','SORT preco'],'DESC = decrescente.'),
 M(5,'Para que serve o HAVING?',null,['Filtrar os grupos depois do GROUP BY','Criar tabelas','Dar permissão','Apagar linhas'],'WHERE filtra linhas; HAVING filtra grupos.'),
 M(5,'Qual comando conta quantas vendas existem?',null,['SELECT COUNT(*) FROM vendas;','SELECT SUM(*) FROM vendas;','COUNT vendas;','SELECT TOTAL FROM vendas;'],'COUNT conta linhas.'),
 M(3,'Para que serve NOT NULL?',null,['Não deixar o campo vazio','Não deixar repetir','Apagar valores nulos','Ordenar a coluna'],'NOT NULL obriga a preencher.'),
 M(2,'Por que usar um SGBD em vez de uma planilha para a cantina?',null,['Controla quem acessa, garante regras dos dados e aguenta muitos usuários ao mesmo tempo','Porque é mais colorido','Porque não precisa de computador','Porque não precisa de backup'],'SGBD tem integridade, permissões e acesso simultâneo.'),
 M(4,'O caixa só tem SELECT e tenta DELETE. O que acontece?',null,['O PostgreSQL recusa com permission denied','Apaga tudo','Apaga só uma linha','O banco desliga'],'Sem permissão, o SGBD recusa.'),

function monitorar(ta){const m={teclas:0,colagens:0,ini:0,ativo:0,ult:0,saltos:0,maxSalto:0};
 const bloq=e=>{e.preventDefault();m.colagens++;toast('Aqui não pode colar: digite com as suas mãos. ✋',3000)};
 ta.addEventListener('paste',bloq);ta.addEventListener('drop',bloq);
 ta.addEventListener('keydown',e=>{const t=Date.now();if(!m.ini)m.ini=t;if(m.ult&&t-m.ult<8000)m.ativo+=t-m.ult;m.ult=t});
 ta.addEventListener('beforeinput',e=>{if(e.inputType==='insertLineBreak'||(e.inputType==='insertText'&&e.data&&e.data.length<=2))m.teclas+=e.data?e.data.length:1;
  if(e.data&&e.data.length>3&&e.inputType!=='insertCompositionText'){m.saltos++;m.maxSalto=Math.max(m.maxSalto,e.data.length)}
  if(e.inputType==='insertFromPaste'||e.inputType==='insertFromDrop'){e.preventDefault();m.colagens++}});
 return m}

 [/\[[^\]\n]+\bfor\b[^\]\n]+\bin\b[^\]\n]+\]/,'list comprehension (não vista)'],[/#\s*(calculate|ask|get|print|define|function|check|return|create|read)\b/i,'comentário em inglês'],
 [/[\u{1F300}-\u{1FAFF}]/u,'emoji'],[/\b(em resumo|vale ressaltar|é importante (notar|destacar)|além disso,|dessa forma,)/i,'expressão típica de texto gerado'],[/—/,'travessão longo (—), comum em texto de IA']];
function suspeitaIA(txt,m,esperado){const mot=[];let s=0;const n=txt.replace(/\s/g,'').length;
 if(m){if(n>12&&n>m.teclas*1.25+8){s+=3;mot.push('texto apareceu sem ser digitado')}
  if(m.maxSalto>25){s+=3;mot.push('bloco grande de texto inserido de uma vez')}
  const seg=Math.max(1,m.ativo/1000);if(n>40&&n/seg>9){s+=2;mot.push('velocidade de digitação impossível')}
  if(m.colagens>0){s+=1;mot.push(m.colagens+' tentativa(s) de colar')}}
 let mk=0;for(const[re,t]of MARCAS_IA)if(re.test(txt)&&mk<3){mk++;s+=1;mot.push(t)}
 if(esperado&&n>esperado*3.5){s+=1;mot.push('muito mais longo do que o pedido')}
 return{s,mot}}

 for(const c of q.ch){const src=c[0]===null?c[2](X()):c[0];let ok=false;try{ok=new RegExp(src,'i').test(t)}catch(e){}(ok?achou:faltou).push(c[1])}
 const letras=txt.replace(/\s/g,'').length;const sus=suspeitaIA(txt,mon,q.letras*3);
 let r=0;if(sus.s>=3)r=0;else if(achou.length>=q.min&&letras>=q.letras)r=1;else if(achou.length>=Math.ceil(q.min/2)&&letras>=q.letras/2)r=0.5;

function resumoUC(u){const e=S.ucs[u.id];if(!e)return{feitos:0,pct:0,m:null};
 const pn=e.niv.reduce((a,x,k)=>a+(x?ajust(u.id,'n'+k,x.r):0),0);
 const feitos=e.niv.filter(Boolean).length;let m=null,pct=0,pc=0;
 if(e.chef&&e.chef.res.length===5){pc=e.chef.res.reduce((a,x,i)=>a+ajust(u.id,'c'+i,x.r),0);pct=(pn*PONTOS_NIVEL+pc*PONTOS_CHEFE)/150;
  m=pct>=0.7&&pc>=3?'A':pct>=0.5?'PA':'NA'}
 const recOk=e.recs.some((r,k)=>r.res.length===5&&recA(u.id,k,r));
 return{feitos,pn,pc,pct,m,final:m==='A'?'A':recOk?'A':m,recOk,tent:e.recs.filter(r=>r.res.length===5).length}}
function recA(id,k,r){const soma=r.res.reduce((a,x,i)=>a+ajust(id,'r'+k+'_'+i,x.r),0);
